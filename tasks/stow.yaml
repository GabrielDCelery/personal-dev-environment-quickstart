- name: Run stow tasks
  tags:
    - stow
  block:
    - name: Install stow
      community.general.homebrew:
        name: stow
        state: latest

    - name: Create .config directory if does not exist
      ansible.builtin.file:
        path: $HOME/.config
        state: directory

    - name: Clone personal dotfiles from public GitHub repository
      ansible.builtin.git:
        repo: git@github.com:GabrielDCelery/personal-dotfiles.git
        dest: $HOME/.dotfiles
        version: main
        update: yes
        clone: yes

    # Must exist before stow runs, otherwise stow symlinks the whole directory
    # into the dotfiles repo and gpg writes private keys there
    - name: Create .gnupg directory if does not exist
      ansible.builtin.file:
        path: $HOME/.gnupg
        state: directory
        mode: "0700"

    - name: Stow $HOME/.dotfiles
      ansible.builtin.shell: stow --dir=$HOME/.dotfiles .
